<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>
      Site Client Demo
    </title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;

        font-family:
          Arial,
          sans-serif;

        background: #f3f1ec;
        color: #1b1b1b;
      }

      .site-header {
        padding: 24px 30px;

        background: #17324d;
        color: white;
      }

      .site-header h1 {
        margin: 0;
      }

      .hero {
        max-width: 1100px;

        margin: 0 auto;

        padding:
          60px
          24px
          30px;
      }

      .hero h2 {
        margin:
          0
          0
          12px;

        font-size: 42px;
      }

      .hero p {
        max-width: 650px;

        line-height: 1.6;
      }

      .configurator-wrapper {
        max-width: 1180px;

        margin: 0 auto;

        padding:
          20px
          24px
          70px;
      }

      .configurator-wrapper h2 {
        margin-bottom: 18px;
      }

      .configurator-host {
        overflow: hidden;

        border:
          1px solid #d3d3d3;

        border-radius: 16px;

        background: white;

        box-shadow:
          0
          10px
          40px
          rgba(
            0,
            0,
            0,
            0.06
          );
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <h1>
        Compania Client SRL
      </h1>
    </header>

    <section class="hero">
      <h2>
        Ferestre pentru casa ta
      </h2>

      <p>
        Aceasta este o pagină
        demonstrativă care simulează
        website-ul unei companii
        complet independente de
        aplicația configuratorului.
      </p>
    </section>

    <section class="configurator-wrapper">
      <h2>
        Configurează produsul
      </h2>

      <div
        class="configurator-host"
        data-configurator-client="ferestre-max"
        data-configurator-title="Configurator Ferestre Max"
      ></div>
    </section>

    <script src="/configurator-embed.js"></script>
  </body>
</html>
